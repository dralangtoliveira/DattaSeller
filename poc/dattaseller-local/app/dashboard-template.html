<!DOCTYPE html>
<!-- TEMPLATE DO DASHBOARD (v2) — substituir __DADOS__ pelo JSON (ver SKILL.md). Salvar como dashboard.html na RAIZ da pasta conectada -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DattaSeller — Painel comercial local</title>
<style>
:root{
 --paper:#F4F2EC;--surface:#FBFAF7;--white:#FFFFFF;--ink:#211F1C;--muted:#6F6B64;--line:#E3DFD5;
 --accent:#C96D4D;--accent-2:#A95338;--accent-soft:#F5E3DB;
 --ok:#6A9B72;--ok-soft:#E7EFE8;--warn:#C98A2D;--warn-soft:#F6ECD9;--cinza:#B7B2A7;
 --novo:#7A8CA8;--rede:#9C7BB8;--pub:#5E9DA8;--prop:#C98A2D;--resp:#6A9B72;--fech:#4E8757;
 --serif:Georgia,'Times New Roman',serif;--sans:-apple-system,'Segoe UI',Roboto,Inter,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100vh;display:flex;overflow-x:hidden}
aside{width:232px;min-height:100vh;background:var(--ink);color:#EDEAE3;padding:24px 14px;position:fixed;top:0;bottom:0;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;padding:0 10px 20px;border-bottom:1px solid #3A3835;margin-bottom:16px}
.logo .burst{width:34px;height:34px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff}
.logo b{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.2px}
.logo span{display:block;font-size:10.5px;color:#A8A399;margin-top:1px}
nav{display:flex;flex-direction:column;gap:4px}
nav button{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 30px;align-items:center;gap:8px;background:none;border:0;color:#CFC9BE;font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:9px;cursor:pointer;text-align:left;font-family:var(--sans);transition:background .15s,color .15s}
nav button:hover{background:#33312E;color:#fff}
nav button:focus-visible,.acoes a:focus-visible,.pagin button:focus-visible,.cmp-tabs button:focus-visible,.btn-ct:focus-visible{outline:3px solid #D9775760;outline-offset:2px}
nav button.on{background:var(--accent);color:#fff}
nav button.on::before{content:'';position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:#F1B39A}
nav button .qt{justify-self:end;min-width:24px;text-align:center;font-size:11px;background:#00000035;padding:2px 7px;border-radius:999px}
.side-foot{margin-top:auto;font-size:11px;color:#A29B8F;padding:14px 10px 4px;line-height:1.55;max-width:190px}
main{margin-left:232px;flex:1;min-width:0;padding:22px 28px 0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#view{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding-bottom:14px}
#view>.stats,#view>.painel,#view>.dica-drag,#view>.sites-grid{flex:0 0 auto}
.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px;flex:0 0 auto}
.topbar h1{font-family:var(--serif);font-size:26px;font-weight:600;margin:0;letter-spacing:-.2px}
.topbar .upd{color:var(--muted);font-size:12px}
.busca{margin-left:auto;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13.5px;width:260px;color:var(--ink);font-family:var(--sans);transition:border-color .15s,box-shadow .15s}
.busca:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px}
.stat{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-height:88px;box-shadow:0 1px 2px #211F1C08}
.stat .n{font-family:var(--serif);font-size:32px;font-weight:600;line-height:1.05}
.stat .l{color:var(--muted);font-size:12px;margin-top:7px;font-weight:600}
.stat.laranja .n{color:var(--accent)}.stat.verde .n{color:var(--fech)}.stat.ambar .n{color:var(--warn)}
.painel{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:24px;box-shadow:0 1px 2px #211F1C06}
.painel h2{font-family:var(--serif);font-size:17px;margin:0 0 14px;font-weight:600}
.funil .linha{display:grid;grid-template-columns:138px 1fr 32px;align-items:center;gap:16px;margin:10px 0;font-size:12.5px}
.funil .linha>b{text-align:right;font-variant-numeric:tabular-nums}
.funil .barra{height:14px;border-radius:7px;background:var(--paper);overflow:hidden}
.funil .fill{height:100%;border-radius:7px;min-width:2px}
.fup-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.fup-item:last-child{border:0}
.fup-item .dias{background:var(--warn-soft);color:var(--warn);font-weight:700;font-size:11px;padding:3px 9px;border-radius:12px;white-space:nowrap}
.board{display:flex;gap:16px;overflow-x:auto;align-items:flex-start;flex:1;min-height:0;padding:2px 2px 12px}
.board::-webkit-scrollbar,.cards::-webkit-scrollbar{height:9px;width:9px}
.board::-webkit-scrollbar-thumb,.cards::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.board::-webkit-scrollbar-thumb:hover,.cards::-webkit-scrollbar-thumb:hover{background:var(--cinza)}
.col{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 10px 10px 14px;flex:0 0 276px;width:276px;display:flex;flex-direction:column;min-height:300px;max-height:calc(100vh - 168px)}
.cards{flex:1;overflow-y:auto;min-height:116px;padding-right:6px}
.col>h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;margin:2px 4px 14px;display:flex;justify-content:space-between;color:#4E4A43;flex:0 0 auto}
.col>h3 span{color:var(--muted);font-variant-numeric:tabular-nums}
.card{display:flex;flex-direction:column;background:var(--white);border:1px solid var(--line);border-top:3px solid var(--cor,var(--accent));border-radius:11px;padding:14px;margin-bottom:12px;box-shadow:0 2px 5px #211F1C0A}
.card .nm{font-weight:700;font-size:14px}
.card .mt{color:var(--muted);font-size:12px;margin:5px 0}
.card .motivo{color:var(--muted);font-size:12px;font-style:italic;margin:7px 0;border-left:2px solid var(--line);padding-left:8px;line-height:1.45}
.acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.acoes a{font-size:11px;font-weight:700;text-decoration:none;padding:6px 10px;border-radius:8px;background:var(--paper);color:#4E4A43;border:1px solid var(--line);transition:background .15s,border-color .15s,color .15s}
.acoes a:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-2)}
.acoes a.del{margin-left:auto;color:#A95338;background:#FAF2EF;border-color:#EECFC4}
.acoes a.del:hover{background:#F5E3DB;border-color:#C96D4D}
.tag{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;margin-left:6px;vertical-align:1px}
.fup{background:var(--warn-soft);color:var(--warn)}
.valor{color:var(--fech);font-weight:800;font-size:13px;margin-top:6px}
select.st{font-size:11.5px;border:1px solid var(--line);border-radius:7px;padding:4px 6px;background:var(--surface);color:var(--ink);font-family:var(--sans);margin-top:9px;width:100%}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:left;padding:10px;border-bottom:1px solid var(--line);background:var(--surface);cursor:pointer;white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:var(--surface)}
.pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;white-space:nowrap}
.painel.tab{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;margin-bottom:0}
.twrap{flex:1;min-height:0;overflow:auto}
.pagin{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--muted);flex:0 0 auto;border-top:1px solid var(--line);padding-top:12px}
.pagin .info{margin-right:auto}
.pagin button{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer;font-family:var(--sans)}
.pagin button:hover{border-color:var(--accent);color:var(--accent-2)}
.pagin button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pagin button:disabled{opacity:.4;cursor:default}
.pagin select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12.5px;background:var(--white);color:var(--ink);font-family:var(--sans)}
.sites-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.site-card{background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.site-card .prev{height:190px;overflow:hidden;border-bottom:1px solid var(--line);background:var(--paper)}
.site-card iframe{width:200%;height:380px;border:0;transform:scale(.5);transform-origin:0 0;pointer-events:none}
.site-card{display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s}
.site-card:hover{box-shadow:0 6px 18px #00000014;transform:translateY(-2px)}
.site-card .info{padding:14px 16px 12px}
.s-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.s-nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-sub{color:var(--muted);font-size:12px;margin:3px 0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-main{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.s-main a{text-align:center;padding:9px 6px;border-radius:9px;font-size:12.5px;font-weight:700;text-decoration:none}
.s-main .prim{background:var(--accent);color:#fff}
.s-main .prim:hover{background:var(--accent-2)}
.s-main .sec{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.s-main .sec:hover{border-color:var(--accent);color:var(--accent-2)}
.s-icons{display:flex;border-top:1px solid var(--line);padding-top:9px;margin:0 -4px}
.s-icons a{flex:1;text-align:center;font-size:11.5px;font-weight:600;color:var(--muted);text-decoration:none;padding:5px 2px;border-radius:7px}
.s-icons a:hover{background:var(--paper);color:var(--accent-2)}
.s-icons a.del:hover{color:#B0483B;background:#B0483B14}
.fin-check{width:17px;height:17px;accent-color:var(--fech);cursor:pointer}
select.mini{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;background:var(--surface);color:var(--ink);font-family:var(--sans);cursor:pointer}
.btn-ct{display:inline-block;font-size:12px;font-weight:700;text-decoration:none;padding:6px 12px;border-radius:8px;margin:2px 4px 2px 0;white-space:nowrap}
.btn-ct.ver{background:var(--accent);color:#fff}
.btn-ct.ver:hover{background:var(--accent-2)}
.btn-ct.baixar{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn-ct.baixar:hover{border-color:var(--accent);color:var(--accent-2)}
.btn-ct.ass{background:var(--ok-soft);color:var(--ok)}
.ct-pendente{background:#B7B2A733;color:#6E6A63}.ct-enviado{background:var(--warn-soft);color:var(--warn)}.ct-assinado{background:var(--ok-soft);color:var(--ok)}
#doc-bg{position:fixed;inset:0;background:#000000AA;display:none;z-index:60;flex-direction:column}
#doc-bg.aberto{display:flex}
.doc-bar{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--ink);color:#EDEAE3;flex:0 0 auto}
.doc-bar b{font-family:var(--serif);font-size:15px}
.doc-bar .sp{flex:1}
.doc-bar button{border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans)}
.doc-bar .imp{background:var(--accent);color:#fff}
.doc-bar .imp:hover{background:var(--accent-2)}
.doc-bar .fech{background:#3A3835;color:#EDEAE3}
#doc-frame{flex:1;border:0;width:100%;background:#E9E7E1}
.vazio{color:var(--muted);font-size:12.5px;text-align:center;padding:14px 4px}
.card[draggable=true]{cursor:grab}
.card.arrastando{opacity:.45;transform:rotate(1.5deg)}
.col.alvo{outline:2px dashed var(--accent);outline-offset:-4px;background:var(--accent-soft)}
.dica-drag{color:var(--muted);font-size:11.5px;margin:0 0 10px}
.hidden{display:none}
.acoes a.del{color:#B0483B}
.modo{font-size:11px;font-weight:700;padding:4px 10px;border-radius:12px}
.modo.db{background:var(--ok-soft);color:var(--ok)}
.modo.file{background:var(--warn-soft);color:var(--warn)}
#modal-bg{position:fixed;inset:0;background:#00000055;display:none;align-items:center;justify-content:center;z-index:50}
#modal-bg.aberto{display:flex}
#modal{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:24px;width:460px;max-width:92vw;max-height:88vh;overflow-y:auto;box-shadow:0 18px 44px #211F1C2B}
#modal h2{font-family:var(--serif);font-size:18px;margin:0 0 14px}
#modal label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:10px 0 4px}
#modal input,#modal select,#modal textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:13px;font-family:var(--sans);color:var(--ink);background:var(--surface)}
#modal input:focus,#modal select:focus,#modal textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#modal .mrow{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
#modal .mbot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#modal .mbot button{border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans)}
#modal .salvar{background:var(--accent);color:#fff}
#modal .salvar:hover{background:var(--accent-2)}
#modal .cancelar{background:var(--paper);color:var(--ink);border:1px solid var(--line)!important}
@media(max-width:860px){
 body{display:block}
 aside{position:sticky;z-index:40;top:0;width:100%;min-height:auto;padding:10px 12px;display:block}
 .logo{padding:0 4px 10px;margin-bottom:8px}.logo .burst{width:30px;height:30px}.side-foot{display:none}
 nav{flex-direction:row;overflow-x:auto;padding-bottom:2px}nav button{flex:0 0 auto;display:flex;min-width:max-content;padding:8px 10px}nav button.on::before{display:none}
 main{margin-left:0;height:auto;min-height:calc(100vh - 112px);padding:18px 16px 0;overflow:visible}
 #view{overflow:visible}.topbar{gap:10px;margin-bottom:16px}.busca{order:2;margin-left:0;width:100%}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:14px;min-height:78px}.stat .n{font-size:26px}
 .painel{padding:18px}.board{min-height:420px}.col{max-height:none}.cmp-grid{grid-template-columns:1fr;min-height:720px}
}
@media(max-width:520px){.funil .linha{grid-template-columns:96px 1fr 24px;gap:8px}.fup-item{align-items:flex-start;flex-wrap:wrap}#modal .mrow{grid-template-columns:1fr}}
.cmp-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.cmp-tabs button{border:1px solid var(--line);background:var(--white);padding:8px 16px;border-radius:20px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted);font-family:var(--sans)}
.cmp-tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1 1 auto;min-height:0}
.cmp-col{display:flex;flex-direction:column;background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:0}
.cmp-col .cab{padding:9px 14px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.cmp-col .cab.antes{color:var(--muted)} .cmp-col .cab.depois{color:var(--accent)}
.cmp-col iframe{flex:1 1 auto;width:100%;border:0;min-height:0;background:#fff}
@media(max-width:900px){.cmp-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<aside>
  <div class="logo"><div class="burst">✳</div><div><b>DattaSeller</b><span>operação comercial local</span></div></div>
  <nav id="nav"></nav>
  <div class="side-foot">Baseado no Prospector. Contatos, envio de propostas, publicação e checkout exigem confirmação humana.</div>
</aside>
<main>
  <div class="topbar"><h1 id="titulo">Visão geral</h1><span class="upd" id="upd"></span><span class="modo file" id="modo" title="Abra pelo iniciar-dashboard.bat para salvar no banco">modo arquivo</span><button id="limpar-ov" style="display:none;border:1px solid var(--line);background:var(--white);color:var(--muted);font-size:11px;font-weight:700;padding:4px 10px;border-radius:12px;cursor:pointer;font-family:var(--sans)" onclick="if(confirm('Descartar as edições feitas neste navegador e voltar aos dados do plugin?')){localStorage.removeItem('prospector_ov');location.reload()}">limpar edições locais</button><input class="busca" id="busca" placeholder="Buscar cliente, nicho, cidade..."></div>
  <div id="view"></div>
</main>
<div id="doc-bg"><div class="doc-bar"><b id="doc-titulo">Contrato</b><span class="sp"></span><button class="imp" onclick="printDoc()">🖨 Imprimir / Salvar PDF</button><button class="fech" onclick="fecharDoc()">Fechar ✕</button></div><iframe id="doc-frame"></iframe></div>
<div id="modal-bg" onclick="if(event.target===this)fecharEdit()"><div id="modal">
<h2 id="m-titulo">Editar lead</h2>
<label>Nome</label><input id="m-nome">
<div class="mrow"><div><label>E-mail</label><input id="m-email"></div><div><label>Telefone</label><input id="m-telefone"></div></div>
<div class="mrow"><div><label>WhatsApp (55DDDnúmero)</label><input id="m-whatsapp"></div><div><label>Cidade</label><input id="m-cidade"></div></div>
<div class="mrow"><div><label>Nicho</label><input id="m-nicho"></div><div><label>Status</label><select id="m-status"></select></div></div>
<div class="mrow"><div><label>Valor (R$)</label><input id="m-valor" type="number" step="50"></div><div><label>Data da proposta</label><input id="m-dataProposta" type="date"></div></div>
<div class="mrow"><div><label>Manutenção mensal (R$)</label><input id="m-manutencao" type="number" step="10"></div><div><label>Pagamento recebido?</label><select id="m-pago"><option value="0">Não</option><option value="1">Sim</option></select></div></div>
<div class="mrow"><div><label>Contrato</label><select id="m-contratoStatus"><option value="pendente">Pendente</option><option value="enviado">Enviado</option><option value="assinado">Assinado</option></select></div><div><label>Data do contrato</label><input id="m-contratoEm" type="date"></div></div>
<div class="mrow"><div><label>CPF/CNPJ do cliente</label><input id="m-docCliente" placeholder="para o contrato"></div><div><label>Endereço do cliente</label><input id="m-endCliente" placeholder="rua, nº — para o contrato"></div></div>
<label>URL publicada</label><input id="m-urlNova">
<div class="mrow"><div><label>Instagram público</label><input id="m-instagram_url"></div><div><label>Fonte pública</label><input id="m-source_url"></div></div>
<div class="mrow"><div><label>Fonte verificada em</label><input id="m-source_checked_at" placeholder="AAAA-MM-DD"></div><div><label>Tipo de contato público</label><input id="m-public_contact_type" placeholder="e-mail, WhatsApp, formulário..."></div></div>
<div class="mrow"><div><label>Produto sugerido</label><input id="m-product_suggested" placeholder="Datta360 ou Datta VPS"></div><div><label>Status de entrega</label><input id="m-delivery_status" placeholder="manual / pendente"></div></div>
<label>Motivo do produto / próxima ação</label><textarea id="m-product_reason" rows="2"></textarea>
<label>Próxima ação</label><input id="m-next_action" placeholder="Aguardar aprovação humana para contato">
<label>Checkout oficial (somente URL configurada)</label><input id="m-checkout_url" placeholder="vazio = Datta VPS desabilitado">
<div class="mrow"><div><label>Checkout apresentado em</label><input id="m-checkout_presented_at" readonly></div><div><label>Checkout clicado em</label><input id="m-checkout_clicked_at" readonly></div></div>
<label>Qualificação estruturada (JSON)</label><textarea id="m-qualification_json" rows="2"></textarea>
<label>Auditoria do site (JSON)</label><textarea id="m-site_audit_json" rows="2"></textarea>
<label>Auditoria do Instagram (JSON)</label><textarea id="m-instagram_audit_json" rows="2"></textarea>
<label>Observações</label><textarea id="m-obs" rows="2"></textarea>
<div class="mbot"><button class="cancelar" onclick="fecharEdit()">Cancelar</button><button class="salvar" onclick="salvarEdit()">Salvar</button></div>
</div></div>
<script id="dados" type="application/json">{"atualizado":"","leads":[]}</script>
<script>
var D=JSON.parse(document.getElementById('dados').textContent);
var OV=JSON.parse(localStorage.getItem('prospector_ov')||'{}');
var MODE='file';

 var db=MODE==='db';
 var campos=CFG_CAMPOS.map(function(c){return '<div><label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:12px 0 4px">'+c[1]+'</label><input id="cfg-'+c[0]+'" value="'+((CFG[c[0]]||'').replace(/"/g,'&quot;'))+'" '+(db?'':'disabled')+' style="width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13.5px;font-family:var(--sans);color:var(--ink);background:var(--surface)"></div>'}).join('');
 var vpsOk=vpsDisponivel(),vpsStatus=vpsOk?'Oferta ativa':'Aguardando configuração';
 var vpsCampos='<div><label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:12px 0 4px">Nome da oferta</label><input id="vps-offer_name" value="'+((VPS.offer_name||'').replace(/"/g,'&quot;'))+'" '+(db?'':'disabled')+' style="width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px"></div><div><label>Descrição curta aprovada</label><textarea id="vps-offer_description" rows="2" '+(db?'':'disabled')+'>'+((VPS.offer_description||'').replace(/</g,'&lt;'))+'</textarea></div><div class="mrow"><div><label>Preço oficial (R$)</label><input id="vps-offer_price" type="number" min="0" step="0.01" value="'+(VPS.offer_price||'')+'" '+(db?'':'disabled')+'></div><div><label>Disponibilidade</label><select id="vps-enabled" '+(db?'':'disabled')+'><option value="0"'+(VPS.enabled?'':' selected')+'>Desabilitada</option><option value="1"'+(VPS.enabled?' selected':'')+'>Ativa</option></select></div></div><div><label>URL oficial HTTPS do checkout</label><input id="vps-checkout_url" type="url" value="'+((VPS.checkout_url||'').replace(/"/g,'&quot;'))+'" '+(db?'':'disabled')+' style="width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px"></div>';
 return '<div class="painel" style="max-width:640px"><h2>Meus dados — quem assina os contratos</h2><p style="font-size:13px;color:var(--muted);margin:0 0 6px">Preencha uma vez e todo contrato gerado pelo /contrato já sai com os seus dados de CONTRATADO(A) completos. Fica salvo no prospector-config.json, no seu computador.</p>'+campos+'<div style="margin-top:18px;display:flex;gap:10px;align-items:center"><button '+(db?'':'disabled')+' onclick="salvarCfg()" style="border:0;border-radius:10px;padding:11px 22px;font-size:13.5px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff">Salvar meus dados</button><span id="cfg-ok" style="color:var(--ok);font-weight:700;font-size:13px;display:none">salvo ✓</span>'+(db?'':'<span style="color:var(--warn);font-size:12.5px;font-weight:600">abra pelo iniciar-dashboard.bat para editar — ou dite os dados ao Codex no /setup</span>')+'</div></div>'+
 '<div class="painel" style="max-width:640px"><h2>Oferta DattaVPS <span class="pill" style="margin-left:8px">'+vpsStatus+'</span></h2><p style="font-size:13px;color:var(--muted);margin:0">O CTA aparece somente em leads indicados para DattaVPS/ambos quando esta oferta estiver ativa. Apresentação e clique ficam registrados separadamente. O clique não confirma pagamento, provisionamento ou entrega.</p>'+vpsCampos+'<div style="margin-top:18px;display:flex;gap:10px;align-items:center"><button '+(db?'':'disabled')+' onclick="salvarVps()" style="border:0;border-radius:10px;padding:11px 22px;font-size:13.5px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff">Salvar oferta</button><span id="vps-ok" style="font-size:13px;font-weight:700"></span></div></div>'+
 '<div class="painel" style="max-width:640px"><h2>Publicação e credenciais</h2><p style="font-size:13px;color:var(--muted);margin:0">A publicação usa o fluxo /publicar com ChatGPT Sites. Dados de acesso permanecem fora da interface e do repositório.</p></div>'+
 '<div class="painel" style="max-width:640px"><h2>E os dados do cliente?</h2><p style="font-size:13px;color:var(--muted);margin:0">CPF/CNPJ e endereço do cliente entram quando ele fechar: peça pelo WhatsApp e, após receber autorização, (1) cole a resposta para o Codex no /contrato ou (2) preencha no ✎ dados do card. O que faltar sai como "preencher" na minuta.</p></div>'}
function salvarCfg(){var body={};CFG_CAMPOS.forEach(function(c){body[c[0]]=document.getElementById('cfg-'+c[0]).value||''});
 fetch('/api/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({contratante:body})}).then(function(){CFG=body;var ok=document.getElementById('cfg-ok');ok.style.display='inline';setTimeout(function(){ok.style.display='none'},2000)})}
function salvarVps(){var body={offer_name:document.getElementById('vps-offer_name').value.trim(),offer_description:document.getElementById('vps-offer_description').value.trim(),offer_price:document.getElementById('vps-offer_price').value,checkout_url:document.getElementById('vps-checkout_url').value.trim(),enabled:document.getElementById('vps-enabled').value==='1'};var out=document.getElementById('vps-ok');fetch('/api/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({dattavps:body})}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.erro||'Não foi possível salvar');return j})}).then(function(){VPS=body;render()}).catch(function(e){out.style.color='var(--danger)';out.textContent=e.message})}
function ordenar(c){if(c==='x')return;if(sortCol===c)sortAsc=!sortAsc;else{sortCol=c;sortAsc=true}pag=1;render()}
var cmpSel=null;
function vComparador(){var ls=fil().filter(function(l){return l.slug&&['redesenhado','publicado','proposta','respondeu','fechado'].indexOf(l.status)>=0});
 if(!ls.length)return '<div class="painel"><div class="vazio">Sem sites redesenhados ainda — rode /redesenhar no Codex e o antes/depois aparece aqui.</div></div>';
 if(!cmpSel||!ls.some(function(l){return l.slug===cmpSel}))cmpSel=ls[0].slug;
 var l=ls.filter(function(x){return x.slug===cmpSel})[0];
 var antiga=l.siteAntigo?((l.siteAntigo.indexOf('http')===0?l.siteAntigo:'https://'+l.siteAntigo)):null;
 var preview=(DS.previews||[]).filter(function(p){return p.lead_slug===l.slug})[0];
 var nova=preview?preview.url:'sites/'+l.slug+'/'+l.slug+'.html';
 return '<div class="cmp-tabs">'+ls.map(function(x){return '<button class="'+(x.slug===cmpSel?'on':'')+'" onclick="cmpSel=\''+x.slug+'\';render()">'+x.nome+'</button>'}).join('')+'</div>'
 +'<div class="cmp-grid"><div class="cmp-col"><div class="cab antes">Antes — site atual'+(antiga?' · <a href="'+antiga+'" target="_blank" style="color:inherit">abrir ↗</a>':'')+'</div>'+(antiga?'<iframe src="'+antiga+'" loading="lazy"></iframe>':'<div class="vazio" style="padding:30px">Sem URL do site antigo registrada.</div>')+'</div>'
 +'<div class="cmp-col"><div class="cab depois">Depois — '+(preview?'preview local persistido':'nova versão')+' · <a href="'+nova+'" target="_blank" style="color:inherit">abrir ↗</a></div><iframe src="'+nova+'"></iframe></div></div>'
 +'<div style="font-size:11.5px;color:var(--muted);margin-top:8px">Alguns sites antigos bloqueiam visualização embutida — se o lado "Antes" ficar em branco, use o link "abrir ↗".</div>'}
var DS={products:[],proposals:[],emails:[],orders:[],checkouts:[],payments:[],contracts:[],handoffs:[],commissions:[],previews:[],qualifications:[],diagnoses:[],socialAudits:[],financial:{},timeline:[],settings:{}};
function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(x){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]})}
function money(v){return 'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}
function dsLoad(){return Promise.all(['products','proposals','emails','orders','checkouts','payments','contracts','handoffs','commissions','financial','timeline','settings','previews','qualifications','diagnoses'].map(function(n){return fetch('/api/'+n).then(function(r){return r.json()}).then(function(x){DS[n]=x})}),fetch('/api/social-audits').then(function(r){return r.json()}).then(function(x){DS.socialAudits=x})).then(render).catch(function(){})}
function dsPost(path,body){return fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})}).then(function(r){return r.json()}).then(function(x){if(x.error||x.erro)alert(x.error||x.erro);return dsLoad()})}
function dsCreateProposal(){var lead=document.getElementById('ws-lead').value.trim(),product=document.getElementById('ws-product').value,price=document.getElementById('ws-price').value;if(!lead){document.getElementById('ws-msg').textContent='Informe o slug de um lead existente.';return}dsPost('/api/proposals',{lead_slug:lead,product_id:product,negotiated_price:price===''?null:Number(price)})}
function dsEmail(proposal){var lead=(DS.proposals.filter(function(p){return p.id===proposal})[0]||{}).lead_slug;dsPost('/api/emails',{lead_slug:lead,proposal_id:proposal,subject:'Proposta personalizada para revisão',body:'Olá, preparei uma proposta factual para sua revisão humana.'})}
function dsTransitionEmail(id,status){dsPost('/api/emails/'+id+'/transition',{status:status,fixture:status})}
function dsOrder(id){dsPost('/api/orders',{proposal_id:id})}
function dsCheckout(id,status){dsPost('/api/orders/'+id+'/checkout',status?{result:status}:{})}
function dsPayment(id,status){dsPost('/api/orders/'+id+'/payment',{status:status})}
function dsContract(id){dsPost('/api/orders/'+id+'/contract',{})}
function dsContractState(id,status){dsPost('/api/contracts/'+id+'/transition',{status:status})}
function dsHandoff(id,status){dsPost('/api/orders/'+id+'/handoff',{status:status})}
function vWorkspace(){var props=DS.proposals||[], emails=DS.emails||[], orders=DS.orders||[];var productOptions=(DS.products||[]).filter(function(p){return p.active}).map(function(p){return '<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>'}).join('');
 return '<div class="painel"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><h2 style="margin-right:auto">Central comercial <small style="color:var(--accent)">MODO DEMONSTRAÇÃO</small></h2><button onclick="dsLoad()">↻ Atualizar</button></div><div class="mrow"><div><label>Slug do lead</label><input id="ws-lead" list="ws-leads" placeholder="lead existente"><datalist id="ws-leads">'+leads.map(function(l){return '<option value="'+esc(l.slug)+'">'+esc(l.nome)+'</option>'}).join('')+'</datalist></div><div><label>Produto</label><select id="ws-product">'+productOptions+'</select></div><div><label>Preço negociado</label><input id="ws-price" type="number" min="0" step="0.01" placeholder="preço-base"></div></div><button onclick="dsCreateProposal()">+ Criar proposta</button> <span id="ws-msg"></span><div class="twrap"><table><thead><tr><th>Proposta</th><th>Lead</th><th>Valores</th><th>Validade</th><th>E-mail</th><th>Pedido</th></tr></thead><tbody>'+props.map(function(p){var es=emails.filter(function(e){return e.proposal_id===p.id});var o=orders.filter(function(x){return x.lead_slug===p.lead_slug&&x.product_id===p.product_id})[0];return '<tr><td><b>'+esc(p.product_id)+'</b><br><small>'+esc(p.status)+'</small></td><td>'+esc(p.lead_slug)+'</td><td>base '+money(p.base_price)+'<br>neg. '+money(p.negotiated_price)+' · margem '+money(p.margin)+'</td><td>'+esc(p.valid_until)+'</td><td><button onclick="dsEmail(\''+p.id+'\')">rascunho</button> '+es.map(function(e){return '<button onclick="dsTransitionEmail(\''+e.id+'\',\''+(e.status==='draft'?'reviewed':e.status==='reviewed'?'approved':e.status==='approved'?'sent_simulated':'positive_reply')+'\')">'+esc(e.status)+'</button>'}).join(' ')+'</td><td>'+ (o?'<button onclick="dsCheckout(\''+o.id+'\')">checkout</button>':'<button onclick="dsOrder(\''+p.id+'\')">criar</button>')+'</td></tr>'}).join('')+'</tbody></table></div></div>'+vOrders()}
function vOrders(){var orders=DS.orders||[];return '<div class="painel"><h2>Pedidos, checkout, pagamento e handoff</h2><div class="twrap"><table><thead><tr><th>Pedido</th><th>Produto / valor</th><th>Checkout</th><th>Pagamento</th><th>Contrato</th><th>Handoff</th></tr></thead><tbody>'+orders.map(function(o){var ck=(DS.checkouts||[]).filter(function(x){return x.order_id===o.id})[0],pay=(DS.payments||[]).filter(function(x){return x.order_id===o.id})[0],ct=(DS.contracts||[]).filter(function(x){return x.order_id===o.id})[0],h=(DS.handoffs||[]).filter(function(x){return x.order_id===o.id})[0];return '<tr><td><small>'+esc(o.id)+'</small><br>'+esc(o.lead_slug)+'</td><td>'+esc(o.product_id)+'<br>'+money(o.negotiated_price)+'</td><td>'+(ck?esc(ck.status):'<button onclick="dsCheckout(\''+o.id+'\')">abrir</button>')+' '+(ck&&ck.status==='open'?'<button onclick="dsCheckout(\''+o.id+'\',\'completed\')">concluir</button><button onclick="dsCheckout(\''+o.id+'\',\'abandoned\')">abandonar</button>':'')+'</td><td>'+(pay?esc(pay.status):'')+' <button onclick="dsPayment(\''+o.id+'\',\'approved\')">aprovar</button><button onclick="dsPayment(\''+o.id+'\',\'declined\')">recusar</button><button onclick="dsPayment(\''+o.id+'\',\'refunded\')">reembolsar</button></td><td>'+(ct?esc(ct.status)+' <button onclick="dsContractState(\''+ct.id+'\',\'signed\')">assinar</button>':'<button onclick="dsContract(\''+o.id+'\')">gerar</button>')+'</td><td>'+(h?esc(h.status)+' <button onclick="dsHandoff(\''+o.id+'\',\'delivered\')">entregar</button><button onclick="dsHandoff(\''+o.id+'\',\'failed\')">falhar/retry</button>':'—')+'</td></tr>'}).join('')+'</tbody></table></div></div>'}
function vFinanceiroLocal(){var f=DS.financial||{};return '<div class="stats">'+[['Receita',f.revenue],['Recebido',f.received],['A receber',f.receivable],['Custo',f.cost],['Margem',f.margin],['MRR',f.mrr],['Comissão',f.commission]].map(function(x){return '<div class="stat"><div class="n">'+money(x[1])+'</div><div class="l">'+x[0]+'</div></div>'}).join('')+'</div><div class="painel"><h2>Comissões</h2>'+((DS.commissions||[]).map(function(x){return '<p>'+esc(x.seller)+' — base '+money(x.base)+' · '+x.pct+'% = <b>'+money(x.amount)+'</b></p>'}).join('')||'<div class="vazio">Sem comissões.</div>')+'</div>'}
function vTimeline(){return '<div class="painel"><h2>Timeline persistida</h2>'+((DS.timeline||[]).map(function(e){return '<div class="fup-item"><b>'+esc(e.event)+'</b><span>'+esc(e.lead_slug||'')+'</span><small>'+esc(e.created_at)+'</small></div>'}).join('')||'<div class="vazio">Sem eventos.</div>')+'</div>'}
function vIntelligence(){return '<div class="painel"><h2>Qualificação, diagnóstico e redes sociais</h2><p>Edite os campos estruturados no lead para registrar fatos e hipóteses. Registros persistidos:</p><div class="twrap"><table><thead><tr><th>Lead</th><th>Recomendação</th><th>Confiança</th><th>Diagnóstico</th><th>Rede social</th></tr></thead><tbody>'+leads.map(function(l){var q=(DS.qualifications||[]).filter(function(x){return x.lead_slug===l.slug})[0],d=(DS.diagnoses||[]).filter(function(x){return x.lead_slug===l.slug})[0],s=(DS.socialAudits||[]).filter(function(x){return x.lead_slug===l.slug})[0];return '<tr><td><b>'+esc(l.nome)+'</b><br><button onclick="abrirEdit(\''+l.slug+'\')">editar dados</button></td><td>'+esc((q||{}).recommendation||'insuficiente')+'<br><small>'+esc((q||{}).reason||'')+'</small></td><td>'+esc((q||{}).confidence||'—')+'</td><td>'+((d&&'registrado')||'—')+'</td><td>'+((s&&esc(s.platform))||'—')+'</td></tr>'}).join('')+'</tbody></table></div></div>'}
function vConfigLocal(){var ps=(DS.products||[]).map(function(p){return '<tr><td>'+esc(p.name)+'</td><td><input id="p-'+p.id+'-price" type="number" value="'+p.public_price+'"></td><td><input id="p-'+p.id+'-cost" type="number" value="'+p.cost+'"></td><td>'+p.commission_pct+'%</td><td><button onclick="fetch(\'/api/products/'+p.id+'\',{method:\'PUT\',headers:{\'Content-Type\':\'application/json\'},body:JSON.stringify({public_price:Number(document.getElementById(\'p-'+p.id+'-price\').value),base_price:Number(document.getElementById(\'p-'+p.id+'-price\').value),cost:Number(document.getElementById(\'p-'+p.id+'-cost\').value)})}).then(dsLoad)">salvar</button></td></tr>'}).join('');return '<div class="painel"><h2>Catálogo DEMO / TESTE</h2><div class="twrap"><table><thead><tr><th>Oferta</th><th>Preço</th><th>Custo</th><th>Comissão</th><th></th></tr></thead><tbody>'+ps+'</tbody></table></div><button style="margin-top:12px" onclick="if(confirm(\'Resetar apenas transações DEMO?\'))dsPost(\'/api/demo/reset\',{})">Resetar dados DEMO</button></div>'}
function render(){nav();var views={geral:vGeral,pipeline:vPipeline,clientes:vClientes,sites:vSites,comparador:vComparador,followup:vFollowup,contratos:vContratos,financeiro:vFinanceiroLocal,config:vConfigLocal,workspace:vWorkspace,timeline:vTimeline,intelligence:vIntelligence};document.getElementById('view').innerHTML=(views[view]||vGeral)()}
var dragSlug=null;
function dragIni(e,slug){dragSlug=slug;e.target.classList.add('arrastando');e.dataTransfer.effectAllowed='move'}
function dragFim(e){e.target.classList.remove('arrastando')}
function dragSobre(e){e.preventDefault();e.dataTransfer.dropEffect='move';e.currentTarget.classList.add('alvo')}
function dragSai(e){e.currentTarget.classList.remove('alvo')}
function solta(e,st){e.preventDefault();e.currentTarget.classList.remove('alvo');if(!dragSlug)return;
 var ch={status:st};
 if(st==='fechado'){var v=prompt('Fechou! Valor confirmado (R$):','');if(v===null||v===''||isNaN(parseFloat(v))||parseFloat(v)<=0)return;if(!confirm('Confirma manualmente o fechamento e o valor informado?'))return;ch.valor=parseFloat(v);ch.valor_fechado=parseFloat(v);ch.closingConfirmed=true}
 if(st==='proposta'&&!leads.filter(function(l){return l.slug===dragSlug})[0].dataProposta)ch.dataProposta=new Date().toISOString().slice(0,10);
 salvarOv(dragSlug,ch);dragSlug=null}
document.getElementById('busca').addEventListener('input',function(){busca=this.value;pag=1;render()});
var rsz;window.addEventListener('resize',function(){clearTimeout(rsz);rsz=setTimeout(render,150)});
render();dsLoad();
</script>
