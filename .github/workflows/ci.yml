name: CI

# Gate independente do build da Vercel: roda a bateria local completa no mesmo
# SHA e falha fechado. Os valores NEXT_PUBLIC_* abaixo são placeholders
# públicos — nenhum segredo é usado e nenhum serviço externo é chamado.
on:
  pull_request:
    branches: [hardening/phase-a-containment-clean, main]
  push:
    branches: ["codex/**", "hardening/**"]

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_placeholder_for_ci_build_only

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Secret scan
        run: npm run secret-scan
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npx --yes tsc --noEmit
      - name: Dashboard sync and production patch
        run: |
          node scripts/sync-dashboard.mjs
          node scripts/production-dashboard-patch.mjs
      - name: Build
        run: npx --yes next build
